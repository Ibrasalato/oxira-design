name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          # With a custom domain (public/CNAME) the site lives at the root,
          # otherwise at https://<owner>.github.io/<repo>/
          if [ -f public/CNAME ]; then
            export SITE_URL="https://$(cat public/CNAME)"
            export BASE_PATH="/"
          else
            export SITE_URL="https://${{ github.repository_owner }}.github.io"
            export BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          npm run build
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          PUBLIC_CHAT_ENDPOINT: ${{ vars.CHAT_ENDPOINT }}
          PUBLIC_GA_ID: ${{ vars.GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
